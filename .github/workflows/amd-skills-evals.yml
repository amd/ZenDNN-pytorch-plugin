# Run skillscope with the same graders as amd/skills, but install the harness
# as a Python package instead of calling the reusable workflow (org Actions
# policy does not allowlist amd/skillscope or astral-sh/setup-uv).
# Only GitHub-owned actions are used.
#
# Based on:
# https://github.com/amd/skills/blob/980d11ff4fb25edf5756aa05c474c3398736a3a5/docs/examples/amd-skills-evals.yml

name: AMD Skills Checks

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/amd-skills-evals.yml"
  workflow_dispatch:
    inputs:
      structural:
        description: Structural Tests
        type: boolean
        default: true
      routing:
        description: Routing Tests
        type: boolean
        default: false
      behavioral:
        description: Behavioral Tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  SKILLSCOPE: git+https://github.com/amd/skillscope@v0.1.3
  SKILLS_DIR: skills/serving-llms-on-epyc

jobs:
  structural:
    name: Structural Tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.structural }}
    runs-on: amd-zenai-arc-xsmall-dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$SKILLSCOPE"
      - run: skillscope structural --skills-dir "$SKILLS_DIR"

  routing:
    name: Routing Tests (${{ matrix.skill }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.routing }}
    runs-on: amd-zenai-arc-xsmall-dind
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        skill: [serving-llms-on-epyc]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install "$SKILLSCOPE"
      - run: >-
          skillscope routing
          --skills-dir "$SKILLS_DIR"
          --routing-room "${{ matrix.skill }}"
          --min-accuracy 1
          --output routing-report.json
          --keep-logs routing-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-${{ matrix.skill }}
          path: |
            routing-report.json
            routing-logs/
          if-no-files-found: warn

  behavioral:
    name: Behavioral Tests (${{ matrix.skill }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.behavioral }}
    runs-on: amd-zenai-arc-xsmall-dind
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        skill: [serving-llms-on-epyc]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install "$SKILLSCOPE"
      - run: >-
          skillscope behavioral
          --skills-dir "$SKILLS_DIR"
          --skill "${{ matrix.skill }}"
          --output behavioral-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavioral-${{ matrix.skill }}
          path: behavioral-report.json
          if-no-files-found: warn
